name: Compiler Essence Quebec 1.8.8

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/build-essence-quebec.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Recuperer la source Essence Quebec
        uses: actions/checkout@v4
        with:
          repository: adamrheaume-pdg/PME-Quebec
          ref: main
          path: source
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        uses: android-actions/setup-android@v3
      - name: Installer Android 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Appliquer ameliorations existantes
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          python3 EssenceLanaudiere/build_tools/patch_map.py
          python3 EssenceLanaudiere/build_tools/patch_alerts.py
          python3 EssenceLanaudiere/build_tools/patch_regional_prices.py
          python3 EssenceLanaudiere/build_tools/patch_premium_theme.py
          python3 EssenceLanaudiere/build_tools/patch_mtq_cameras.py
          python3 EssenceLanaudiere/build_tools/patch_radar_safety.py
          python3 EssenceLanaudiere/build_tools/patch_uncluster_poi.py
          python3 EssenceLanaudiere/build_tools/patch_navigation_map.py
          python3 EssenceLanaudiere/build_tools/patch_visual_punch.py
          python3 EssenceLanaudiere/build_tools/patch_neon_drive_ui.py
          python3 EssenceLanaudiere/build_tools/patch_notification_maps.py
          python3 EssenceLanaudiere/build_tools/patch_reference_ui.py
          python3 EssenceLanaudiere/build_tools/patch_reference_map_v2.py
      - name: Reconstruire ressources utilisateur
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          python3 EssenceLanaudiere/build_tools/rebuild_user_assets_tolerant.py
          python3 EssenceLanaudiere/build_tools/repair_user_assets.py
      - name: Appliquer fonctions utilisateur
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          python3 EssenceLanaudiere/build_tools/patch_user_requests.py
          python3 EssenceLanaudiere/build_tools/patch_home_map_final.py
          python3 EssenceLanaudiere/build_tools/patch_qub_radio.py
          python3 EssenceLanaudiere/build_tools/patch_shutdown.py
          python3 EssenceLanaudiere/build_tools/patch_v170.py
          python3 EssenceLanaudiere/build_tools/patch_v180.py
          python3 EssenceLanaudiere/build_tools/patch_v181.py
          python3 EssenceLanaudiere/build_tools/patch_v182.py
          python3 EssenceLanaudiere/build_tools/patch_v183.py
          python3 EssenceLanaudiere/build_tools/patch_v184.py
          python3 EssenceLanaudiere/build_tools/patch_v185.py
          python3 EssenceLanaudiere/build_tools/patch_v186.py
          python3 EssenceLanaudiere/build_tools/patch_v187.py
          python3 EssenceLanaudiere/build_tools/patch_v188.py
      - name: Verifier fonctions 1.8.8
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          FILE='EssenceLanaudiere/app/src/main/java/quebec/lanaudiere/essence/MainActivity.java'
          grep -F 'ESSENCE_QUEBEC_188' "$FILE"
          grep -F 'marker_mccafe.png' "$FILE"
          grep -F 'marker_timhortons.webp' "$FILE"
          grep -F "iconSize:kind==='atm'?[50,50]:[40,40]" "$FILE"
          grep -F "iconAnchor:kind==='atm'?[25,25]:[20,20]" "$FILE"
          grep -F 'width:36px!important' "$FILE"
          grep -F 'eqGoogleHoursView(result)' "$FILE"
          grep -F 'apiLimit=radius>=60?250:50' "$FILE"
          grep -F "versionName '1.8.8'" EssenceLanaudiere/app/build.gradle
      - name: Deployer logo Essence Quebec
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          RES='EssenceLanaudiere/app/src/main/res'
          LOGO="$RES/drawable/essence_quebec_logo.png"
          for d in mipmap-mdpi mipmap-hdpi mipmap-xhdpi mipmap-xxhdpi mipmap-xxxhdpi; do
            mkdir -p "$RES/$d"
            cp "$LOGO" "$RES/$d/ic_launcher.png"
            cp "$LOGO" "$RES/$d/ic_launcher_round.png"
          done
      - name: Installer Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Compiler APK
        run: gradle -p source/EssenceLanaudiere :app:assembleDebug --stacktrace
      - name: Verifier APK final
        shell: bash
        run: |
          set -euo pipefail
          APK='source/EssenceLanaudiere/app/build/outputs/apk/debug/app-debug.apk'
          unzip -t "$APK" >/dev/null
          unzip -l "$APK" | grep -F 'assets/marker_mccafe.png'
          unzip -l "$APK" | grep -F 'assets/marker_timhortons.webp'
          unzip -l "$APK" | grep -F 'assets/marker_safety.png'
          unzip -l "$APK" | grep -F 'assets/marker_finance.png'
          cp "$APK" Essence-Quebec-1.8.8.apk
      - name: Publier APK Essence Quebec
        uses: actions/upload-artifact@v4
        with:
          name: Essence-Quebec-1.8.8
          path: Essence-Quebec-1.8.8.apk
          retention-days: 30
          if-no-files-found: error
